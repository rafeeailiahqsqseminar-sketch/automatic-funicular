<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
#fx{position:absolute;left:0;top:0}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.el{position:absolute;left:0;width:1080px;text-align:center;opacity:0;transform-origin:540px 50%}
.gold{font-family:'Inter Display';font-weight:900;letter-spacing:-1px;line-height:1.02;
  background:linear-gradient(180deg,#FFF8C4 0%,#FFE070 30%,#FFC41E 58%,#EC8000 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:2.5px rgba(60,28,0,.9);
  filter:drop-shadow(0 0 14px rgba(255,170,30,.75)) drop-shadow(0 0 34px rgba(var(--acc),.35)) drop-shadow(0 6px 3px rgba(0,0,0,.7))}
.small{font-family:'Inter Display';font-weight:800;letter-spacing:6px;color:#FFD45A;font-size:44px;
  text-shadow:0 0 12px rgba(255,170,30,.8),0 3px 3px rgba(0,0,0,.8)}
.white{font-family:'Inter Display';font-weight:700;color:#fff;font-size:52px;
  text-shadow:0 0 10px rgba(var(--acc),.6),0 3px 4px rgba(0,0,0,.9)}
.panel{position:absolute;left:60px;width:960px;border-radius:44px;opacity:0;
  background:radial-gradient(120% 90% at 50% 0%,rgba(18,48,92,.86),rgba(4,10,26,.90) 70%);
  border:3px solid rgba(255,200,70,.95);
  box-shadow:0 0 0 1px rgba(var(--acc),.45) inset,0 0 40px rgba(255,170,30,.45),0 20px 60px rgba(0,0,0,.55)}
</style></head>
<body>
<canvas id="fx" width="1080" height="1920"></canvas>
<div class="layer" id="root"></div>
<script>
// ---------- deterministic helpers ----------
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eOut=x=>1-Math.pow(1-clamp(x),3);
const eBack=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
// pop scale 0.6 -> 1.1 -> 1.0 in 0.25s
function popScale(u){if(u<=0)return .6;if(u<.16)return .6+.5*eOut(u/.16);if(u<.25)return 1.1-.1*eOut((u-.16)/.09);return 1}

// ---------- timeline: injected as window.CFG by render_overlay.js (see assets/timeline_example.json) ----------
const CFG=window.CFG;
const POPS=CFG.pops;           // [[time_s,'TEXT'],...]
const CARDS=CFG.cards;         // {t,d,top,title:[lines],sub,dna}
const END=CFG.end;             // {t,cta,cta_text,label,big,platform,question}
const OPEN_END=CFG.opening_end||3.3;
const POP_HOLD=CFG.pop_hold||1.35;
const ACC=CFG.accent||'110,215,255';   // accent rgb (2nd DNA strand, cool sparkles, glow)
const HEADY=CFG.head_y||400;           // centre of text zone (keep on empty wall above head)
const INTRO=CFG.intro||null;
window.WINDOWS=[[0,Math.max(OPEN_END,INTRO?INTRO.t1+.1:0)]].concat(POPS.map(p=>[p[0]-.02,p[0]+POP_HOLD+.25]),CARDS.map(c=>[c.t-.02,c.t+c.d+.3]),[[END.t-.02,1e9]]);

// ---------- build DOM ----------
document.documentElement.style.setProperty('--acc',ACC);
const root=document.getElementById('root');
function mk(cls,html,top,extra=''){const d=document.createElement('div');d.className='el '+cls;d.innerHTML=html;d.style.top=top+'px';if(extra)d.style.cssText+=extra;root.appendChild(d);return d}
const fit=(s,max,w=960)=>Math.min(max,Math.floor(w/(0.66*s.length)));
const popEls=POPS.map(([t,s])=>{const fs=fit(s,176);return {t,s,el:mk('gold',s,HEADY-fs*0.55,'font-size:'+fs+'px')}});
const cardEls=CARDS.map(c=>{
  const fs=Math.min(c.fs||150,...c.title.map(l=>fit(l,150)));
  const h=58+c.title.length*fs*1.02+60;const y0=(c.y||HEADY)-40-h/2;
  const g={c,top:mk('small',c.top,y0),
    title:mk('gold',c.title.join('<br>'),y0+58,'font-size:'+fs+'px'),
    sub:mk('white',c.sub,y0+58+c.title.length*fs*1.02+8)};
  g.y0=y0;g.h=h+60;return g});
// end card
const ep=document.createElement('div');ep.className='panel';ep.style.top='80px';ep.style.height='560px';root.appendChild(ep);
const e1=mk('small',END.label||'KELAS ONLINE',120);
const e2=mk('gold',END.big||'PERCUMA',168,'font-size:150px');
const e3=mk('white',END.platform||'Web &nbsp;•&nbsp; Telegram',332,'font-size:46px');
const e4=mk('white',END.question||'Ingin meneruskan kelas ini?',430,'font-size:44px;font-weight:500');
const e5=mk('gold',END.cta_text||'KOMEN NAK',496,'font-size:'+fit(END.cta_text||'KOMEN NAK',118)+'px');

// ---------- canvas fx ----------
const cv=document.getElementById('fx'),cx=cv.getContext('2d');
function sparkles(t,t0,dur,cy,seed,n=46,spread=470){
  const r=rng(seed);
  for(let i=0;i<n;i++){
    const bx=540+(r()-.5)*2*spread, by=cy+(r()-.5)*260, delay=r()*.5, life=.9+r()*1.1, sz=2+r()*5, vx=(r()-.5)*60, vy=-40-r()*90, hue=r();
    const u=(t-t0-delay)/life; if(u<0||u>1||t-t0>dur+.4)continue;
    const a=Math.sin(Math.PI*u)*(.6+.4*Math.sin(t*14+i));
    const x=bx+vx*u*life, y=by+vy*u*life;
    cx.globalAlpha=clamp(a);
    const col=hue<.72?'255,215,110':ACC;
    const g=cx.createRadialGradient(x,y,0,x,y,sz*4);g.addColorStop(0,'rgba('+col+',1)');g.addColorStop(.25,'rgba('+col+',.55)');g.addColorStop(1,'rgba('+col+',0)');
    cx.fillStyle=g;cx.beginPath();cx.arc(x,y,sz*4,0,7);cx.fill();
    // star cross
    cx.strokeStyle='rgba(255,250,220,'+clamp(a)+')';cx.lineWidth=1.2;cx.beginPath();cx.moveTo(x-sz*3,y);cx.lineTo(x+sz*3,y);cx.moveTo(x,y-sz*3);cx.lineTo(x,y+sz*3);cx.stroke();
  }
  cx.globalAlpha=1;
}
function backdrop(cy,h,a){ // soft navy glow behind text for contrast on bright wall
  if(a<=0)return;cx.save();cx.globalAlpha=a;
  cx.translate(540,cy);cx.scale(1,h/560);
  const g=cx.createRadialGradient(0,0,0,0,0,560);
  g.addColorStop(0,'rgba(6,16,40,.82)');g.addColorStop(.55,'rgba(6,16,40,.55)');g.addColorStop(1,'rgba(6,16,40,0)');
  cx.fillStyle=g;cx.beginPath();cx.arc(0,0,560,0,7);cx.fill();cx.restore();
}
function helix(t,cy,prog,a){ // horizontal DNA double helix, gold + cyan, drawing in from the center
  if(a<=0)return;const W=1000,amp=58,k=2*Math.PI/300,ph=t*2.4;
  const half=W/2*eOut(prog);
  cx.save();cx.globalAlpha=a;cx.lineCap='round';
  for(let x=-half;x<=half;x+=30){ // rungs
    const s1=Math.sin(k*x+ph),s2=Math.sin(k*x+ph+Math.PI);
    const depth=(Math.cos(k*x+ph)+1)/2;
    cx.strokeStyle='rgba(255,220,140,'+(.18+.35*depth)+')';cx.lineWidth=3;
    cx.beginPath();cx.moveTo(540+x,cy+amp*s1);cx.lineTo(540+x,cy+amp*s2);cx.stroke();
  }
  [[0,'255,196,60'],[Math.PI,ACC]].forEach(([o,col])=>{
    cx.shadowColor='rgba('+col+',1)';cx.shadowBlur=18;
    for(let x=-half;x<half;x+=6){
      const depth=(Math.cos(k*x+ph+o)+1)/2;
      cx.strokeStyle='rgba('+col+','+(.35+.65*depth)+')';cx.lineWidth=3+5*depth;
      cx.beginPath();cx.moveTo(540+x,cy+amp*Math.sin(k*x+ph+o));cx.lineTo(540+x+6,cy+amp*Math.sin(k*(x+6)+ph+o));cx.stroke();
    }
  });
  cx.restore();
}
function sweep(t,t0,dur,y,h){ // light ray sweep across
  const u=(t-t0)/dur;if(u<0||u>1)return;
  const x=-300+u*1700;cx.save();cx.globalCompositeOperation='lighter';
  const g=cx.createLinearGradient(x-160,0,x+160,0);g.addColorStop(0,'rgba(255,220,140,0)');g.addColorStop(.5,'rgba(255,230,170,.32)');g.addColorStop(1,'rgba(255,220,140,0)');
  cx.fillStyle=g;cx.translate(0,y);cx.transform(1,0,-.35,1,0,0);cx.fillRect(x-200,0,400+h*.35,h);cx.restore();
}


// ---------- intro illustration (CFG.intro={t0,t1,scene}). scene 'kaya_sekejap': car + RM notes + chart up -> red crash -> kapcai.
// For a new title, add another scene function in the same style (glass navy panel y 90-560, ~2.4 s) and branch on INTRO.scene.
function rrect(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function goldFill(y0,y1){const g=cx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,'#FFF4B8');g.addColorStop(.4,'#FFD040');g.addColorStop(1,'#D87400');return g}
function wheel(x,y,r,rot){cx.save();cx.translate(x,y);cx.fillStyle='#1a1408';cx.beginPath();cx.arc(0,0,r,0,7);cx.fill();
  cx.strokeStyle='#FFD45A';cx.lineWidth=r*.16;cx.beginPath();cx.arc(0,0,r*.62,0,7);cx.stroke();
  cx.rotate(rot);cx.lineWidth=r*.1;for(let i=0;i<5;i++){cx.rotate(1.2566);cx.beginPath();cx.moveTo(0,0);cx.lineTo(r*.6,0);cx.stroke()}cx.restore()}
function car(x,y,s,a,rot){if(a<=0)return;cx.save();cx.globalAlpha=a;cx.translate(x,y);cx.scale(s,s);
  cx.shadowColor='rgba(255,170,30,.9)';cx.shadowBlur=26;cx.fillStyle=goldFill(-120,0);cx.strokeStyle='rgba(60,28,0,.95)';cx.lineWidth=5;
  cx.beginPath();cx.moveTo(-200,-30);cx.quadraticCurveTo(-205,-62,-170,-70);cx.lineTo(-95,-80);cx.quadraticCurveTo(-55,-128,10,-130);
  cx.quadraticCurveTo(80,-130,120,-84);cx.lineTo(185,-70);cx.quadraticCurveTo(212,-62,208,-30);cx.lineTo(200,-8);cx.lineTo(-195,-8);cx.closePath();cx.fill();cx.shadowBlur=0;cx.stroke();
  cx.fillStyle='rgba(12,30,64,.92)';cx.beginPath();cx.moveTo(-78,-82);cx.quadraticCurveTo(-45,-118,5,-119);cx.lineTo(8,-82);cx.closePath();cx.fill();
  cx.beginPath();cx.moveTo(22,-82);cx.lineTo(20,-119);cx.quadraticCurveTo(75,-117,102,-84);cx.closePath();cx.fill();
  cx.fillStyle='rgba(255,255,230,.9)';cx.beginPath();cx.ellipse(196,-46,9,6,0,0,7);cx.fill();
  wheel(-118,-8,40,rot);wheel(118,-8,40,rot);cx.restore()}
function moto(x,y,s,a,rot){if(a<=0)return;cx.save();cx.globalAlpha=a;cx.translate(x,y);cx.scale(s,s);
  cx.strokeStyle='#C9C2B0';cx.lineCap='round';cx.lineJoin='round';cx.lineWidth=9;
  cx.beginPath();cx.moveTo(-70,-8);cx.lineTo(-25,-48);cx.lineTo(35,-48);cx.lineTo(70,-8);cx.moveTo(35,-48);cx.lineTo(48,-92);cx.lineTo(30,-98);cx.moveTo(48,-92);cx.lineTo(66,-96);cx.stroke();
  cx.fillStyle='#8f8a7c';rrect(-58,-66,62,16,8);cx.fill();
  cx.fillStyle='#5b574d';cx.beginPath();cx.moveTo(-30,-46);cx.lineTo(22,-46);cx.lineTo(10,-22);cx.lineTo(-24,-22);cx.closePath();cx.fill();
  [-70,70].forEach(wx=>{cx.save();cx.translate(wx,-8);cx.fillStyle='#1a1408';cx.beginPath();cx.arc(0,0,32,0,7);cx.fill();cx.strokeStyle='#9a9384';cx.lineWidth=5;cx.beginPath();cx.arc(0,0,19,0,7);cx.stroke();cx.rotate(rot);cx.lineWidth=4;for(let i=0;i<4;i++){cx.rotate(1.5708);cx.beginPath();cx.moveTo(0,0);cx.lineTo(18,0);cx.stroke()}cx.restore()});
  // smoke puffs
  for(let i=0;i<3;i++){const k=(rot*.15+i/3)%1;cx.fillStyle='rgba(200,200,200,'+(.35*(1-k))+')';cx.beginPath();cx.arc(-95-k*70,-14-k*20,10+k*14,0,7);cx.fill()}
  cx.restore()}
function note(x,y,r,a){if(a<=0)return;cx.save();cx.globalAlpha=a;cx.translate(x,y);cx.rotate(r);
  const g=cx.createLinearGradient(-40,-20,40,20);g.addColorStop(0,'#FFE58A');g.addColorStop(1,'#E39A10');cx.fillStyle=g;rrect(-42,-22,84,44,6);cx.fill();
  cx.strokeStyle='rgba(70,35,0,.9)';cx.lineWidth=3;cx.stroke();cx.fillStyle='rgba(70,35,0,.95)';cx.font='900 22px "Inter Display"';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('RM',0,1);cx.restore()}
function intro(t){if(!INTRO)return;if(INTRO.scene==='memaafkan')return introMaaf(t);if(INTRO.scene==='minta_maaf')return introMinta(t);const u=t-INTRO.t0,D=INTRO.t1-INTRO.t0;if(u<0||u>D)return;
  const A=clamp(u/.3)*clamp((D-u)/.3),slide=(1-eOut(u/.45))*60;
  const X=90,Y=90+slide,W=900,H=470;
  cx.save();cx.globalAlpha=A;
  // glass navy panel
  const pg=cx.createRadialGradient(540,Y,0,540,Y,900);pg.addColorStop(0,'rgba(18,48,92,.88)');pg.addColorStop(.7,'rgba(4,10,26,.92)');
  cx.shadowColor='rgba(255,170,30,.5)';cx.shadowBlur=40;cx.fillStyle=pg;rrect(X,Y,W,H,44);cx.fill();cx.shadowBlur=0;
  cx.strokeStyle='rgba(255,200,70,.95)';cx.lineWidth=3;cx.stroke();
  // clip inside panel
  rrect(X+3,Y+3,W-6,H-6,41);cx.clip();
  // grid
  cx.strokeStyle='rgba('+ACC+',.13)';cx.lineWidth=2;for(let gy=Y+80;gy<Y+H-100;gy+=70){cx.beginPath();cx.moveTo(X+40,gy);cx.lineTo(X+W-40,gy);cx.stroke()}
  // chart: up (gold) then crash (red)
  const P=[[140,400],[230,360],[300,380],[390,300],[460,320],[560,210],[640,230],[730,140]].map(([a,b])=>[a,b+slide]);
  const crash=[[730,140],[790,250],[830,230],[900,470]].map(([a,b])=>[a,b+slide]);
  function path(pts,prog,col,w,glow){const n=pts.length-1,e=prog*n;cx.beginPath();cx.moveTo(pts[0][0],pts[0][1]);let end=pts[0];
    for(let i=1;i<=n;i++){if(e>=i){cx.lineTo(pts[i][0],pts[i][1]);end=pts[i]}else if(e>i-1){const f=e-(i-1);end=[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f];cx.lineTo(end[0],end[1]);break}}
    cx.strokeStyle=col;cx.lineWidth=w;cx.lineCap='round';cx.lineJoin='round';cx.shadowColor=glow;cx.shadowBlur=22;cx.stroke();cx.shadowBlur=0;return end}
  const up=clamp((u-.15)/.95),dn=clamp((u-1.2)/.4);
  let tip=path(P,eOut(up),'#FFD040',10,'rgba(255,180,40,1)');
  if(up>0&&dn<=0){cx.fillStyle='#FFF4B8';cx.beginPath();cx.arc(tip[0],tip[1],11,0,7);cx.fill()}
  if(dn>0){tip=path(crash,dn,'#FF4A3A',11,'rgba(255,60,40,1)');
    const pv=crash[crash.length-2];const ang=Math.atan2(tip[1]-pv[1],tip[0]-pv[0]);
    cx.save();cx.translate(tip[0],tip[1]);cx.rotate(ang);cx.fillStyle='#FF4A3A';cx.beginPath();cx.moveTo(18,0);cx.lineTo(-16,-17);cx.lineTo(-16,17);cx.closePath();cx.fill();cx.restore()}
  // shake on crash
  const sh=u>1.2&&u<1.6?Math.sin(u*90)*8*(1-(u-1.2)/.4):0;
  // vehicles
  const cxp=X+40+eOut(u/.7)*230+sh, gy=Y+H-30;
  const morph=clamp((u-1.45)/.35);
  car(cxp,gy,.92*(1-.25*morph),1-morph,u*14);
  moto(cxp-10+morph*20,gy,1.15*eBack(morph),morph,u*9);
  // money notes: fly up during rise, fall away after crash
  const r=rng(77);
  for(let i=0;i<10;i++){const d=r()*.6,vx=(r()-.3)*360,vy=-220-r()*200,rs=(r()-.5)*6;
    const k=u-.3-d;if(k<0)continue;
    let x=cxp+vx*Math.min(k,1.1),y=gy-90+vy*Math.min(k,1.1)+150*Math.min(k,1.1)**2;
    if(u>1.3){const f=u-1.3;y+=420*f*f;x+=vx*.3*f}
    note(x,y,rs*k,clamp(k/.15)*clamp(1-(u-1.6)/.4))}
  cx.restore();
  sparkles(t,INTRO.t0,1.2,Y+H/2,55,30,450);
}


// ---------- scene 'memaafkan' (3 Tanda Kau Memaafkan): gold heart -> red crack splits it -> grey fog hides it (melupakan, crack still glows)
// -> gold light seals the crack into a gold kintsugi seam (memaafkan). Panel y/h from INTRO.y / INTRO.h.
function heartPath(s){cx.beginPath();cx.moveTo(0,-.35*s);
  cx.bezierCurveTo(-.15*s,-.78*s,-.95*s,-.62*s,-.9*s,-.12*s);cx.bezierCurveTo(-.86*s,.25*s,-.3*s,.5*s,0,.82*s);
  cx.bezierCurveTo(.3*s,.5*s,.86*s,.25*s,.9*s,-.12*s);cx.bezierCurveTo(.95*s,-.62*s,.15*s,-.78*s,0,-.35*s);cx.closePath()}
const CRACK=[[0,-.38],[-.1,-.18],[.08,-.02],[-.09,.18],[.07,.38],[-.03,.6],[0,.86]];
function crackClip(s,side){cx.beginPath();cx.moveTo(side*2*s,-s);CRACK.forEach(([x,y])=>cx.lineTo(x*s,y*s));cx.lineTo(side*2*s,s);cx.closePath()}
function introMaaf(t){const u=t-INTRO.t0,D=INTRO.t1-INTRO.t0;if(u<0||u>D)return;
  const A=clamp(u/.3)*clamp((D-u)/.3),slide=(1-eOut(u/.45))*50;
  const X=90,W=900,Y=(INTRO.y||60)+slide,H=INTRO.h||370;
  cx.save();cx.globalAlpha=A;
  const pg=cx.createRadialGradient(540,Y,0,540,Y,900);pg.addColorStop(0,'rgba(18,48,92,.88)');pg.addColorStop(.7,'rgba(4,10,26,.92)');
  cx.shadowColor='rgba(255,170,30,.5)';cx.shadowBlur=40;cx.fillStyle=pg;rrect(X,Y,W,H,44);cx.fill();cx.shadowBlur=0;
  cx.strokeStyle='rgba(255,200,70,.95)';cx.lineWidth=3;cx.stroke();
  rrect(X+3,Y+3,W-6,H-6,41);cx.clip();
  const crack=clamp((u-.45)/.3),split=eOut(clamp((u-.6)/.3))*(1-eOut(clamp((u-1.45)/.45)));
  const fog=clamp((u-.85)/.25)*(1-clamp((u-1.35)/.3)),heal=clamp((u-1.45)/.55);
  const sh=u>.5&&u<.9?Math.sin(u*80)*7*(1-(u-.5)/.4):0;
  const beat=1+.05*Math.sin(u*9)*(u<.45||u>1.9?1:0)+.08*eBack(clamp((u-1.9)/.25))*(1-clamp((u-2.15)/.2));
  const S=140*eBack(clamp(u/.4))*beat, hx=540+sh, hy=Y+H/2-6;
  // warm halo when healed
  if(heal>0){const g=cx.createRadialGradient(hx,hy,0,hx,hy,330);g.addColorStop(0,'rgba(255,200,90,'+(.55*heal)+')');g.addColorStop(1,'rgba(255,170,40,0)');cx.fillStyle=g;cx.fillRect(X,Y,W,H)}
  // two halves
  [-1,1].forEach(side=>{cx.save();cx.translate(hx+side*split*34,hy+split*6);cx.rotate(side*split*.12);
    crackClip(S*1.05,side);cx.clip();heartPath(S);
    cx.shadowColor='rgba(255,170,30,.9)';cx.shadowBlur=30;cx.fillStyle=goldFill(-S,S);cx.fill();cx.shadowBlur=0;
    cx.strokeStyle='rgba(60,28,0,.95)';cx.lineWidth=5;cx.stroke();
    // shine
    cx.fillStyle='rgba(255,255,235,.55)';cx.beginPath();cx.ellipse(-.45*S,-.35*S,.16*S,.09*S,-.6,0,7);cx.fill();
    cx.restore()});
  // crack line: red while wounded, turns gold seam (kintsugi) when healed
  if(crack>0){const n=CRACK.length-1,e=crack*n;cx.save();cx.translate(hx,hy);cx.beginPath();cx.moveTo(CRACK[0][0]*S,CRACK[0][1]*S);
    for(let i=1;i<=n;i++){if(e>=i)cx.lineTo(CRACK[i][0]*S,CRACK[i][1]*S);else if(e>i-1){const f=e-(i-1);cx.lineTo((CRACK[i-1][0]+(CRACK[i][0]-CRACK[i-1][0])*f)*S,(CRACK[i-1][1]+(CRACK[i][1]-CRACK[i-1][1])*f)*S);break}}
    const col=heal>.3?'255,236,150':'255,70,60';
    cx.strokeStyle='rgba('+col+',1)';cx.lineWidth=6+6*heal;cx.lineJoin='round';cx.lineCap='round';cx.shadowColor='rgba('+(heal>.3?'255,200,80':'255,40,30')+',1)';cx.shadowBlur=24+20*heal;cx.stroke();cx.restore()}
  // fog (melupakan): grey clouds drift over, crack still glows through
  if(fog>0){const r=rng(9);for(let i=0;i<14;i++){const fx=hx+(r()-.5)*420+(u-.85)*60*(r()-.5),fy=hy+(r()-.5)*230,fr=60+r()*70;
    const g=cx.createRadialGradient(fx,fy,0,fx,fy,fr);g.addColorStop(0,'rgba(190,196,206,'+(.5*fog)+')');g.addColorStop(1,'rgba(190,196,206,0)');cx.fillStyle=g;cx.beginPath();cx.arc(fx,fy,fr,0,7);cx.fill()}
    cx.save();cx.translate(hx,hy);cx.globalAlpha=A*fog*(.6+.4*Math.sin(u*20));cx.strokeStyle='rgba(255,70,60,1)';cx.lineWidth=5;cx.shadowColor='rgba(255,40,30,1)';cx.shadowBlur=20;
    cx.beginPath();CRACK.forEach(([x,y],i)=>i?cx.lineTo(x*S,y*S):cx.moveTo(x*S,y*S));cx.stroke();cx.restore()}
  // healing light threads from the sides into the crack
  if(heal>0&&heal<1){cx.save();cx.globalCompositeOperation='lighter';
    for(let i=0;i<6;i++){const k=clamp(heal*1.4-i*.07),sy=Y+40+i*55,tx=hx+CRACK[i][0]*S,ty=hy+CRACK[i][1]*S;[-1,1].forEach(sd=>{
      const sx=540+sd*430,px=sx+(tx-sx)*eOut(k),py=sy+(ty-sy)*eOut(k);
      cx.strokeStyle='rgba(255,220,130,'+(.55*(1-heal))+')';cx.lineWidth=3;cx.beginPath();cx.moveTo(sx,sy);cx.quadraticCurveTo((sx+px)/2,sy-40,px,py);cx.stroke();
      cx.fillStyle='rgba(255,245,200,.9)';cx.beginPath();cx.arc(px,py,6,0,7);cx.fill()})}
    cx.restore()}
  cx.restore();
  sparkles(t,INTRO.t0+1.5,1.0,Y+H/2,55,36,420);
}


// ---------- scene 'minta_maaf': a man walks in, bows with hands together, "Maaf..." bubble; a woman in tudung crosses arms and turns her face away.
function figMan(x,gy,bow,step,a){cx.save();cx.globalAlpha*=a;cx.translate(x,gy);
  const hipY=-110,lg=Math.sin(step)*14;
  cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle='rgba(60,28,0,.95)';
  // legs
  cx.lineWidth=26;cx.strokeStyle='#B86A00';cx.beginPath();cx.moveTo(0,hipY);cx.lineTo(-10+lg,0);cx.moveTo(0,hipY);cx.lineTo(10-lg,0);cx.stroke();
  cx.translate(0,hipY);cx.rotate(bow);
  // torso
  cx.shadowColor='rgba(255,170,30,.8)';cx.shadowBlur=20;cx.fillStyle=goldFill(-110,0);rrect(-27,-105,54,112,22);cx.fill();cx.shadowBlur=0;
  cx.strokeStyle='rgba(60,28,0,.95)';cx.lineWidth=4;cx.stroke();
  // head
  cx.fillStyle=goldFill(-170,-110);cx.beginPath();cx.arc(4,-138,30,0,7);cx.fill();cx.stroke();
  cx.fillStyle='rgba(60,28,0,.95)';cx.beginPath();cx.arc(-2,-150,30,Math.PI*1.05,Math.PI*1.95);cx.fill(); // hair
  // arms: hands together in front (salam maaf)
  cx.strokeStyle='#E8A020';cx.lineWidth=17;cx.beginPath();cx.moveTo(0,-88);cx.quadraticCurveTo(26,-62,44,-80);cx.stroke();
  cx.fillStyle='#FFE58A';cx.beginPath();cx.ellipse(48,-86,9,15,.5,0,7);cx.fill();
  cx.restore()}
function figWoman(x,gy,face,a,t){cx.save();cx.globalAlpha*=a;cx.translate(x,gy);
  const col='rgba('+ACC+',1)';
  // long dress
  const g=cx.createLinearGradient(0,-200,0,0);g.addColorStop(0,'#FFD6E2');g.addColorStop(1,col);
  cx.fillStyle=g;cx.strokeStyle='rgba(70,20,40,.9)';cx.lineWidth=4;cx.shadowColor=col;cx.shadowBlur=22;
  cx.beginPath();cx.moveTo(-26,-190);cx.lineTo(26,-190);cx.lineTo(52,0);cx.lineTo(-52,0);cx.closePath();cx.fill();cx.shadowBlur=0;cx.stroke();
  // crossed arms
  cx.fillStyle='#F5A0B8';rrect(-34,-150,68,22,11);cx.fill();cx.stroke();
  // head + tudung, turned by `face` (-1 looks left at him, +1 looks away right); squash during the turn
  cx.save();cx.translate(0,-222);cx.scale(Math.max(.25,Math.abs(face)),1);const f=face<0?-1:1;
  cx.fillStyle='#FFE0EA';cx.beginPath();cx.arc(0,0,40,0,7);cx.fill();cx.stroke();                // tudung
  cx.beginPath();cx.moveTo(-40,4);cx.quadraticCurveTo(-46,46,-30,52);cx.lineTo(30,52);cx.quadraticCurveTo(46,46,40,4);cx.fill();cx.stroke();
  cx.fillStyle='#F2C9A0';cx.beginPath();cx.ellipse(f*17,6,20,26,0,0,7);cx.fill();                 // face
  cx.fillStyle='rgba(60,28,0,.9)';cx.beginPath();cx.arc(f*28,2,3.5,0,7);cx.fill();                 // eye
  cx.strokeStyle='rgba(60,28,0,.9)';cx.lineWidth=3;cx.beginPath();cx.moveTo(f*20,20);cx.lineTo(f*32,18);cx.stroke(); // flat mouth
  cx.restore();
  cx.restore()}
function bubble(x,y,txt,s,a){if(a<=0)return;cx.save();cx.globalAlpha*=a;cx.translate(x,y);cx.scale(s,s);
  cx.fillStyle='rgba(255,255,255,.96)';cx.strokeStyle='rgba(255,200,70,1)';cx.lineWidth=4;rrect(-95,-40,190,72,30);cx.fill();cx.stroke();
  cx.beginPath();cx.moveTo(-40,30);cx.lineTo(-62,62);cx.lineTo(-12,32);cx.closePath();cx.fill();
  cx.fillStyle='#14305C';cx.font='900 44px "Inter Display"';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(txt,0,-3);cx.restore()}
function introMinta(t){const u=t-INTRO.t0,D=INTRO.t1-INTRO.t0;if(u<0||u>D)return;
  const A=clamp(u/.3)*clamp((D-u)/.35),slide=(1-eOut(u/.45))*50;
  const X=90,W=900,Y=(INTRO.y||60)+slide,H=INTRO.h||370;
  cx.save();cx.globalAlpha=A;
  if(INTRO.box===false){backdrop(Y+H*.62,H*.75,.7);}
  else{  const pg=cx.createRadialGradient(540,Y,0,540,Y,900);pg.addColorStop(0,'rgba(18,48,92,.88)');pg.addColorStop(.7,'rgba(4,10,26,.92)');
    cx.shadowColor='rgba(255,170,30,.5)';cx.shadowBlur=40;cx.fillStyle=pg;rrect(X,Y,W,H,44);cx.fill();cx.shadowBlur=0;
    cx.strokeStyle='rgba(255,200,70,.95)';cx.lineWidth=3;cx.stroke();
    rrect(X+3,Y+3,W-6,H-6,41);cx.clip();
  }
  const gy=Y+H-28;
  cx.strokeStyle='rgba(255,200,70,'+(INTRO.box===false?.6:.35)+')';cx.lineWidth=3;cx.beginPath();cx.moveTo(X+150,gy);cx.lineTo(X+W-150,gy);cx.stroke();
  // man walks in (0-0.7s), bows (0.7-1.1s), then a gentle bob
  const walk=eOut(clamp(u/.7)),mx=230+walk*190;
  const bow=.55*eBack(clamp((u-.7)/.4))+(u>1.1?.05*Math.sin((u-1.1)*4):0);
  figMan(mx,gy,bow,u<.7?u*18:0,1);
  // woman: looks at him, then turns away at ~1.3s, arms crossed, tiny huff lines
  const turn=clamp((u-1.25)/.3),face=-1+2*eOut(turn);
  figWoman(720+turn*20,gy,face,1,t);
  if(turn>=1){const k=(u*1.6)%1;cx.save();cx.strokeStyle='rgba(255,255,255,'+(.8*(1-k))+')';cx.lineWidth=4;cx.lineCap='round';
    for(let i=-1;i<=1;i++){cx.beginPath();cx.moveTo(800+k*20,gy-245+i*22);cx.lineTo(825+k*20,gy-250+i*30);cx.stroke()}cx.restore();
    // small grey cloud above her
    const cy=gy-300+Math.sin(u*3)*4;cx.fillStyle='rgba(170,178,192,.85)';[[-26,6,22],[0,-6,28],[28,6,22]].forEach(([dx,dy,r])=>{cx.beginPath();cx.arc(760+dx,cy+dy,r,0,7);cx.fill()})}
  // "Maaf..." bubble
  const bu=u-.95;bubble(mx+120,gy-300,'Maaf...',bu<0?0:popScale(bu),clamp(bu/.1));
  cx.restore();
  sparkles(t,INTRO.t0,1.2,Y+H/2,55,24,420);
}

// ---------- render(t) ----------
window.render=function(t){
  cx.clearRect(0,0,1080,1920);
  // opening: golden rays + sparkles over the existing cover image
  if(t<OPEN_END+.1){
    const a=clamp(t/.3)*clamp((OPEN_END-t)/.4);
    cx.save();cx.globalAlpha=a*.55;cx.globalCompositeOperation='lighter';
    const g=cx.createRadialGradient(0,0,0,0,0,1300);g.addColorStop(0,'rgba(255,200,90,.65)');g.addColorStop(.5,'rgba(255,160,40,.12)');g.addColorStop(1,'rgba(255,150,30,0)');
    cx.fillStyle=g;cx.fillRect(0,0,1080,1920);
    for(let i=0;i<7;i++){const ang=.35+i*.13+Math.sin(t*.8+i)*.03;cx.save();cx.rotate(ang);cx.fillStyle='rgba(255,230,160,'+(.10+.05*Math.sin(t*2+i))+')';cx.fillRect(0,-14-i*3,2400,28+i*6);cx.restore()}
    cx.restore();
    sparkles(t,0,3.2,700,11,70,520);sparkles(t,.9,2.4,1250,12,50,520);
    sweep(t,.4,1.4,0,1920);
  }
  intro(t);
  // pops
  popEls.forEach(({t:t0,el},i)=>{
    const u=t-t0;
    if(u<0||u>POP_HOLD+.22){el.style.opacity=0;return}
    const a=u<.08?u/.08:(u>POP_HOLD?1-(u-POP_HOLD)/.2:1);
    el.style.opacity=clamp(a);el.style.transform='scale('+popScale(u)+')';
    backdrop(HEADY,330,clamp(a)*.95);
    sparkles(t,t0,POP_HOLD,HEADY,100+i,34,430);
    sweep(t,t0+.25,.7,250,300);
  });
  // cards
  cardEls.forEach((g,i)=>{
    const c=g.c,u=t-c.t;
    const on=u>=0&&u<=c.d+.25;
    const a=!on?0:(u<.2?u/.2:(u>c.d?1-(u-c.d)/.25:1));
    const cy=g.y0+g.h/2-30;
    if(on){
      backdrop(cy,g.h+120,clamp(a));
      if(c.dna)helix(t,cy-10,(u-.1)/.8,clamp(a)*.5);
      sparkles(t,c.t,c.d,cy,200+i,44,470);
      sweep(t,c.t+.35,.9,g.y0-40,g.h+40);
    }
    const ty=(1-eOut(u/.35))*30;
    g.top.style.opacity=clamp(a*clamp(u/.25));g.top.style.transform='translateY('+(-ty)+'px)';
    g.title.style.opacity=clamp(a*clamp((u-.08)/.12));g.title.style.transform='scale('+popScale(u-.08)+')';
    g.sub.style.opacity=clamp(a*clamp((u-.4)/.3));g.sub.style.transform='translateY('+ty*(u<.4?1:1-eOut((u-.4)/.35))+'px)';
  });
  // end card
  const u=t-END.t;
  if(u>=0){
    const a=clamp(u/.45), slide=(1-eOut(u/.55))*90;
    ep.style.opacity=a;ep.style.transform='translateY('+slide+'px)';
    [e1,e2,e3,e4].forEach((e,i)=>{const v=clamp((u-.15-i*.12)/.35);e.style.opacity=v;e.style.transform='translateY('+(slide+(1-eOut(v))*25)+'px)'});
    const uc=t-END.cta;
    e5.style.opacity=clamp(uc/.08);e5.style.transform='translateY('+slide+'px) scale('+(uc<.25?popScale(uc):1+.035*Math.sin((uc-.25)*4.2))+')';
    // helix along the panel bottom edge + sparkles
    sparkles(t,END.t,30,360,300,40,470);
    sparkles(t,END.cta,30,560,301,30,430);
    if(uc>0)sweep(t,END.cta+.2,1.0,470,140);
  }else{[ep,e1,e2,e3,e4,e5].forEach(e=>e.style.opacity=0)}
};
