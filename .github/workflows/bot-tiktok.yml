name: Bot Jadual TikTok

on:
  schedule:
    - cron: "*/10 * * * *"   # setiap 10 minit
  workflow_dispatch:          # boleh jalan manual dari tab Actions

permissions:
  contents: write

concurrency:
  group: bot-tiktok
  cancel-in-progress: false

jobs:
  jalan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Jalankan bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python bot-tiktok/bot.py

      - name: Simpan jadual
        run: |
          if [ -n "$(git status --porcelain bot-tiktok/data)" ]; then
            git config user.name "bot-jadual-tiktok"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bot-tiktok/data
            git commit -m "Kemaskini jadual TikTok [skip ci]"
            git pull --rebase
            git push
          fi
